[package]
name = "udf-meter-serial"
version = "0.1.0"
edition = "2024"
publish = false

# A tenant's function module, built on its own: cargo build --release --target wasm32-unknown-unknown
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
parcel-udf = { path = "../../crates/parcel-udf" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
