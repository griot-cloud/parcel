# yaml-language-server: $schema=https://raw.githubusercontent.com/griot-cloud/parcel/main/schema/contract.schema.json
#
# Customer master data: who may read it, which customers each caller sees, which records are
# fit to use, and which values each caller may see unmasked.
contract: sales/customers
version: 1.0.0
owner: our_company

binding:
  parquet: data/customers/
  partitioned_by: [region]

extensions:
  ctx:
    region: string      # a regional caller's home region

expose:
  - {name: customer_id, type: utf8}
  - {name: customer_name, type: utf8}
  - {name: customer_age, type: int64}
  - {name: gender, type: utf8}
  - {name: customer_segment, type: utf8}
  - {name: customer_city, type: utf8}
  - {name: customer_state, type: utf8}
  - {name: customer_country, type: utf8}
  - {name: region, type: utf8}
  - {name: customer_postal_code, type: utf8}
  - {name: customer_acquisition_cost, type: float64}

rules:
  # Who may read
  - id: known_tenant
    op: decide
    expr: ctx.tenant in ["our_company", "acme_partners"]
    message: Our company and approved partners only

  - id: approved_purpose
    op: decide
    expr: ctx.purpose in ["analytics", "marketing", "finance"]
    message: Analytics, marketing or finance only

  - id: partners_market_only
    op: decide
    expr: ctx.tenant == "our_company" || ctx.purpose == "marketing"
    message: Partners may use customer data for marketing only

  # Which customers each caller sees
  - id: home_region
    op: admit
    expr: ctx.tier == "internal" || row.region == ctx.other.region
    message: Regional callers see their own region

  - id: partner_markets
    op: admit
    expr: ctx.tenant == "our_company" || row.customer_country in ["UAE", "USA"]
    message: Partners see UAE and USA customers

  - id: adults_for_marketing
    op: admit
    expr: ctx.purpose != "marketing" || row.customer_age >= 18
    message: No minors in marketing

  # Which records are fit to use
  - id: plausible_age
    op: assert
    expr: row.customer_age >= 0 && row.customer_age <= 120
    on_fail: drop
    message: Age between 0 and 120

  - id: valid_customer_id
    op: assert
    expr: row.customer_id.matches("^CUST-[0-9]{6}$")
    on_fail: drop
    message: Ids look like CUST-000123

  - id: non_negative_cost
    op: assert
    expr: row.customer_acquisition_cost >= 0
    on_fail: drop
    message: Acquisition cost is not negative

  - id: gender_recorded
    op: assert
    expr: has(row.gender)
    on_fail: report
    message: Gender is recorded

  - id: has_rows
    op: guarantee
    expr: dataset.row_count > 0
    on_fail: deny

  - id: ids_complete
    op: guarantee
    expr: dataset.customer_id.null_rate == 0.0
    on_fail: deny

  # Which values each caller sees
  - id: mask_name
    op: transform
    column: customer_name
    expr: 'ctx.tier == "internal" ? row.customer_name : redact(row.customer_name)'
    message: Names for internal staff only

  - id: mask_postal_code
    op: transform
    column: customer_postal_code
    expr: 'ctx.tier == "internal" ? row.customer_postal_code : partial(row.customer_postal_code, 2)'
    message: Partial postal codes outside internal staff

  - id: pseudonymous_id
    op: transform
    column: customer_id
    expr: 'ctx.tenant == "our_company" ? row.customer_id : hash_sha256(row.customer_id)'
    message: Partners get a stable pseudonym

  - id: gender_internal
    op: transform
    column: gender
    expr: 'ctx.tenant == "our_company" ? row.gender : null'
    message: Gender stays inside our company

  - id: cost_for_finance
    op: transform
    column: customer_acquisition_cost
    expr: 'ctx.purpose == "finance" ? row.customer_acquisition_cost : null'
    message: Acquisition cost for finance only
