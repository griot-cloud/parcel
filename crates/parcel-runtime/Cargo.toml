[package]
name = "parcel-runtime"
description = "Runs parcel artifacts: the reference CEL interpreter and function registration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
parcel-core = { path = "../parcel-core", version = "0.0.1" }
cel.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
datafusion-common.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
parcel-udf = { path = "../parcel-udf", version = "0.0.1" }
wasmtime = { version = "47.0.0", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }

[features]
default = ["wasm"]
# Load tenants' WebAssembly functions (design 7.4).
wasm = ["dep:wasmtime"]
