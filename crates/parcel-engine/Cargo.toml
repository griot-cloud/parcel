[package]
name = "parcel-engine"
description = "Reference executor for parcel contracts on DataFusion: write, validate, query"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
parcel-core = { path = "../parcel-core", version = "0.0.1" }
parcel-runtime = { path = "../parcel-runtime", version = "0.0.1" }
datafusion = { version = "55.1.0", default-features = true }
cel.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
