[package]
name = "parcel-core"
description = "Compiler for parcel data contracts: CEL rules to DataFusion plans"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
cel.workspace = true
datafusion-common.workspace = true
datafusion-expr.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
regex-syntax.workspace = true
datafusion-functions = { version = "55.1.0", features = ["crypto_expressions"] }
datafusion-functions-aggregate = { version = "55.1.0", default-features = false }
datafusion-functions-nested = "55.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
schemars = "1.2"
rand = "0.9"

[dev-dependencies]
chrono = "0.4.45"
jsonschema = { version = "0.57", default-features = false }
