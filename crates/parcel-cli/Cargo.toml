[package]
name = "parcel-cli"
description = "The parcel command line: check and compile data contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "parcel"
path = "src/main.rs"

[dependencies]
parcel-core = { path = "../parcel-core", version = "0.0.1" }
parcel-runtime = { path = "../parcel-runtime", version = "0.0.1" }
datafusion = "55.1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


[features]
# `parcel compile --substrait`: needs `protoc` at build time.
substrait = ["parcel-runtime/substrait"]
