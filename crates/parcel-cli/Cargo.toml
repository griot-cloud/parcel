[package]
name = "parcel-cli"
description = "The parcel command line: check and compile data contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "parcel"
path = "src/main.rs"

[dependencies]
parcel-core = { path = "../parcel-core", version = "0.0.4" }
parcel-runtime = { path = "../parcel-runtime", version = "0.0.4" }
parcel-sql = { path = "../parcel-sql", version = "0.0.4" }
parcel-duckdb = { path = "../parcel-duckdb", version = "0.0.4" }
parcel-spark = { path = "../parcel-spark", version = "0.0.4" }
datafusion = "55.1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# `parcel compile --substrait`: needs `protoc` at build time.
substrait = ["parcel-runtime/substrait"]
