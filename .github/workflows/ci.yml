name: ci

# One workflow, after griot-cloud/moruna. Each part answers to a different event:
#
#   a pull request   the gate: fmt, clippy, tests and the examples.
#   a push to main   the same gate, then the release path, which does nothing unless the
#                    version in Cargo.toml has no tag yet. main also takes direct pushes, so
#                    the release waits on the tests of the commit it ships.
#
# Nobody creates a tag. A version that reaches main untagged is the release: the `parcel`
# binary is built and run on every platform we ship, and only once all of them exist is
# v<version> tagged, with the binaries, their checksums and the installers attached. A tag
# therefore always marks something that shipped; pushing one by hand triggers nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is waste; a superseded release is a half-published one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: protoc (for the substrait feature)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Build the example function module
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/udf-meter-serial/Cargo.toml
      - name: Examples end to end
        run: |
          pip install duckdb
          cargo build -p parcel-cli
          PARCEL=$PWD/target/debug/parcel examples/run-all.sh
      - name: The installer scripts parse
        run: sh -n install.sh

  # The release path. `version` reads the tree, `binaries` builds on every platform we
  # ship, and `release` alone holds the token that writes to this repository.
  version:
    name: a version to release
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, because their absence is the question this job answers.
          fetch-depth: 0
      - id: check
        name: Is the version in Cargo.toml already released?
        run: |
          version="$(awk '/^\[workspace.package\]/{f=1; next} /^\[/{f=0} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "no version under [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is tagged already, so this push is not a release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag, so this push releases it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: parcel (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      # Every platform reports; the release still needs all of them.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, native: true }
          - { os: macos-14, target: aarch64-apple-darwin, native: true }
          - { os: macos-14, target: x86_64-apple-darwin, native: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: protoc (for the substrait feature)
        # One pinned release everywhere: the distributions' packages lag (Ubuntu 22.04 ships
        # 3.12, which rejects the proto3 `optional` fields substrait uses).
        run: |
          v=29.3
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64) asset=linux-x86_64 ;;
            Linux-aarch64) asset=linux-aarch_64 ;;
            macOS-*) asset=osx-universal_binary ;;
            Windows-*) asset=win64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-$asset.zip"
          dir="$RUNNER_TEMP/protoc"
          if [ "$RUNNER_OS" = Windows ]; then
            7z x -y -o"$dir" "$RUNNER_TEMP/protoc.zip" >/dev/null
            echo "PROTOC=$(cygpath -w "$dir/bin/protoc.exe")" >> "$GITHUB_ENV"
          else
            unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$dir"
            echo "PROTOC=$dir/bin/protoc" >> "$GITHUB_ENV"
          fi
          "$dir/bin/protoc" --version
      - name: Build
        run: cargo build --release --locked -p parcel-cli --features substrait --target ${{ matrix.target }}
      - name: The binary runs before it is published
        if: matrix.native
        run: |
          exe=target/${{ matrix.target }}/release/parcel
          "$exe" --version
          cd examples/quickstart
          "../../$exe" compile contracts/orders.yaml --schema incoming/orders.csv --type msisdn=utf8 -o "$RUNNER_TEMP/orders.json"
          "../../$exe" compile contracts/orders.yaml --schema incoming/orders.csv --type msisdn=utf8 --substrait "$RUNNER_TEMP/orders.substrait" >/dev/null
      - name: Package
        run: |
          name=parcel-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/parcel.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            cp target/${{ matrix.target }}/release/parcel "dist/$name/"
            (cd dist && tar -czf "$name.tar.gz" "$name" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
          rm -rf "dist/$name"
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish and tag
    needs: [version, binaries]
    runs-on: ubuntu-latest
    permissions:
      # Write access for the tag and release below, and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: bin
      - name: Every binary that was built is here
        run: ls -la bin
      - name: Tag what was published, with the binaries and installers attached
        # Last, never before a build: a tag made first survives a failed build and names a
        # release that does not exist.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(awk -v v="$VERSION" '/^## /{ if (f) exit; h=$2; gsub(/[\[\]:]/,"",h); if (h == v) {f=1; next} } f' CHANGELOG.md 2>/dev/null || true)"
          install="$(cat <<EOF


          ## Install

          Linux and macOS: \`curl -LsSf https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`

          Windows: \`powershell -ExecutionPolicy ByPass -c "irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex"\`

          Or download the archive for your platform below and check it against its \`.sha256\`.
          EOF
          )"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "${notes:-See the repository for changes.}$install" \
            bin/* install.sh install.ps1
